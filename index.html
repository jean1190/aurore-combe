<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurore Combe</title>

    <!-- Import pour garantir l'aspect ciselé de la pierre -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --text-color: #e6e1dc;
            --breath-duration: 8s;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #000;
            color: var(--text-color);
            font-family: "Playfair Display", "Didot", "Times New Roman", serif;
        }

        /* Fond qui respire - approche simple et robuste */
        .breath {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1715;
            animation: breathe var(--breath-duration) ease-in-out infinite alternate;
        }

        .breath::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle,
                rgba(80, 70, 60, 0.8) 0%,
                rgba(40, 35, 30, 0.5) 30%,
                transparent 60%);
            animation: glow var(--breath-duration) ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { background: #0d0c0b; }
            100% { background: #1f1c1a; }
        }

        @keyframes glow {
            0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        .container {
            position: relative;
            height: 100vh;
            /* Fallback */
            height: 100dvh;
            /* Mobile viewport fix */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12vh;
            z-index: 2;
        }

        #racine {
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: riseUp 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
            padding: 0 20px;
        }

        p {
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.03em;
            line-height: 1.5;
            margin: 0;
            color: var(--text-color);
            background: linear-gradient(to bottom, #ffffff 10%, #8a8885 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Language Toggle */
        .lang-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            z-index: 100;
        }

        .lang-btn {
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.4;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            padding: 0;
            line-height: 1;
        }

        .lang-btn:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }

        .lang-btn.active {
            opacity: 1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes riseUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile : respiration accentuée */
        @media (max-width: 600px) {
            .container {
                justify-content: center;
                padding-bottom: 0;
            }

            #racine {
                padding: 0 2rem;
            }

            p {
                font-size: clamp(1.2rem, 5vw, 1.6rem);
                line-height: 1.7;
            }

            .breath {
                animation: breathe-mobile 6s ease-in-out infinite alternate;
            }

            .breath::after {
                background: radial-gradient(circle,
                    rgba(130, 115, 95, 0.9) 0%,
                    rgba(80, 70, 55, 0.6) 35%,
                    transparent 65%);
                animation: glow-mobile 6s ease-in-out infinite alternate;
            }
        }

        @keyframes breathe-mobile {
            0% { background: #0a0908; }
            100% { background: #2a2520; }
        }

        @keyframes glow-mobile {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.7); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
        }
    </style>
</head>

<body>

    <div class="lang-toggle">
        <button class="lang-btn active" data-lang="fr" title="Français">🇫🇷</button>
        <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
    </div>

    <div class="breath"></div>

    <div class="container">
        <div id="racine">
            <p data-i18n="quote">Toute lumière prend racine dans la pierre.</p>
        </div>
    </div>

    <script>
        // --- i18n ---
        const translations = {
            fr: { "quote": "Toute lumière prend racine dans la pierre." },
            en: { "quote": "All light takes root in stone." }
        };

        let currentLang = localStorage.getItem('lang') || 'fr';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
        }
        setLanguage(currentLang);
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });
    </script>

</body>

</html>
